<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>瞑想時間記録・管理</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
    }
    h1 {
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 16px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    .table-container, .chart-container {
      margin-top: 30px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #28a745;
      color: white;
    }
    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background-color: #c82333;
    }
    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }
    footer hr {
      margin: 30px 0;
    }
    .form-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navigate-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>瞑想時間記録</h1>
  <form id="meditation-form">
    <p>現在時刻が自動入力されています．</p>
    <div class="form-row">
      <label for="meditation-date">日付:</label>
      <input type="date" id="meditation-date" required />
    </div>

    <div class="form-row">
      <label for="meditation-time-minutes">瞑想時間（分）:</label>
      <input type="number" id="meditation-time-minutes" required min="0" placeholder="分" />
    </div>

    <div class="form-row">
      <label for="meditation-time-seconds">瞑想時間（秒）:</label>
      <input type="number" id="meditation-time-seconds" required min="0" max="59" placeholder="秒" />
    </div>

    <button type="submit">記録</button>
  </form>

  <h2>瞑想時間グラフ</h2>
  <div class="chart-container">
    <canvas id="meditationChart" width="400" height="200"></canvas>
  </div>

  <div class="navigate-buttons">
    <button id="prevWeekBtn">＜ 前の7日間</button>
    <button id="nextWeekBtn">次の7日間 ＞</button>
  </div>

  <h2>記録一覧</h2>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>瞑想時間（分:秒）</th>
          <th>削除</th>
        </tr>
      </thead>
      <tbody id="meditation-log"></tbody>
    </table>
  </div>

  <footer>
    <hr />
    <p>ご不明な点がある場合は、お問い合わせフォームよりご連絡ください。</p>
  </footer>

  <script>
  function getTodayString() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  let meditationData = JSON.parse(localStorage.getItem('meditationData')) || {};
  let currentStartDate = getCurrentStartDate();

  document.getElementById('meditation-date').value = getTodayString();

  function getCurrentStartDate() {
    const today = new Date();
    const day = today.getDay();
    const diff = today.getDate() - day + (day === 0 ? -6 : 1); // 月曜日開始
    today.setDate(diff);
    return today;
  }

  function formatDate(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function getWeekData(startDate) {
    const weekData = {};
    for (let i = 0; i < 7; i++) {
      const date = new Date(startDate);
      date.setDate(startDate.getDate() + i);
      const formattedDate = formatDate(date);
      weekData[formattedDate] = meditationData[formattedDate] || null;
    }
    return weekData;
  }

  function updateTable() {
    const logTable = document.getElementById('meditation-log');
    const weekData = getWeekData(currentStartDate);
    logTable.innerHTML = '';
    for (const date in weekData) {
      if (weekData[date]) {
        logTable.innerHTML += `<tr>
          <td>${date}</td>
          <td>${weekData[date]}</td>
          <td><button class="delete-btn" onclick="deleteRecord('${date}')">削除</button></td>
        </tr>`;
      }
    }
    updateChart(weekData);
  }

  function updateChart(weekData) {
    const dates = Object.keys(weekData);
    const times = Object.values(weekData).map(t => {
      if (t) {
        const [minutes, seconds] = t.split(':').map(num => parseInt(num));
        return minutes + seconds / 60;
      }
      return null;
    });

    const ctx = document.getElementById('meditationChart').getContext('2d');
    if (window.myChart) window.myChart.destroy();

    window.myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates,
        datasets: [{
          label: '瞑想時間（分）',
          data: times,
          borderColor: '#28a745',
          backgroundColor: '#28a74533',
          fill: true,
          tension: 0.1
        }]
      },
      options: {
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const rawMinutes = context.raw;
                const minutes = Math.floor(rawMinutes);
                const seconds = Math.round((rawMinutes - minutes) * 60);
                const label = `${minutes}分${seconds.toString().padStart(2, '0')}秒`;
                return `瞑想時間: ${label}`;
              }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: '時間（分）'
            }
          }
        }
      }
    });
  }

  function deleteRecord(date) {
    if (confirm(`${date} の記録を削除しますか？`)) {
      delete meditationData[date];
      localStorage.setItem('meditationData', JSON.stringify(meditationData));
      updateTable();
    }
  }

  document.getElementById('meditation-form').addEventListener('submit', function(event) {
    event.preventDefault();
    const date = document.getElementById('meditation-date').value;
    const minutes = document.getElementById('meditation-time-minutes').value;
    const seconds = document.getElementById('meditation-time-seconds').value;

    if (meditationData[date]) {
      const confirmOverwrite = confirm("この日の記録はすでに存在します。上書きしますか？");
      if (!confirmOverwrite) return;
    }

    const time = `${parseInt(minutes)}:${seconds.toString().padStart(2, '0')}`;
    meditationData[date] = time;
    localStorage.setItem('meditationData', JSON.stringify(meditationData));
    updateTable();
  });

  document.getElementById('prevWeekBtn').addEventListener('click', () => {
    currentStartDate.setDate(currentStartDate.getDate() - 7);
    updateTable();
  });

  document.getElementById('nextWeekBtn').addEventListener('click', () => {
    currentStartDate.setDate(currentStartDate.getDate() + 7);
    updateTable();
  });

  updateTable();
</script>

</body>
</html>
